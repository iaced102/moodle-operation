apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: moodle
  name: moodle
spec:
  replicas: 1
  serviceName: moodle-service
  selector:
    matchLabels:
      app: moodle
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: moodle
    spec:
      containers:
        - env:
          - name: DB_HOST_READ
            value: 10.26.157.147
          - name: DB_HOST_WRITE
            value: 10.26.157.54
          - name: DB_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: DB_USER
            value: root
          - name: DB_READ_USER
            value: root
          - name: DB_PASS
            value: dOXMAdDBtgNE18y8yUWEzNZMxwPhpd0FTNeV
          - name: THEME
            value: edumy
          - name: REDIS_HOST
            value: 103.107.183.77
          - name: REDIS_PORT
            value: '6379'
          - name: REDIS_PASS
            value: Vcc123**
          - name: REDIS_LOCK_TIMEOUT
            value: '30'
          - name: REDIS_LOCK_EXPIRE
            value: '7200'
          - name: REDIS_LOCK_RETRY
            value: '5'
          - name: SERVER_NAME
            value: 'localhost'
          image: cr-hn-1.bizflycloud.vn/31ff9581861a4d0ea4df5e7dda0f665d/lms-moodle402-test:latest
          #command: ["/bin/sh", "-c"]
          #args: ["if ! [ -d /tmp/moodle ]; then rm -rf /tmp/moodle/* ; fi"]
          name: moodle
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              protocol: TCP
            - containerPort: 443
              protocol: TCP
          volumeMounts:
            - mountPath: /var/www/site
              name: moodle-pvc
          resources:
            limits:
              cpu: '2'
              memory: 2000Mi
            requests:
              cpu: '2'
              memory: 2000Mi
      initContainers:
        - name: moodle-hack
          image: cr-hn-1.bizflycloud.vn/31ff9581861a4d0ea4df5e7dda0f665d/lms-moodle402-test:latest
          command: ["/bin/sh", "-c"]
          args: ["if ! [ -d /var/www/site/moodledata/lang ]; then rm -rf /var/www/site/moodledata/* && rm -rf /tmp/moodle/* && rm -rf /var/www/moodledata_src/temp/ /var/www/moodledata_src/trashdir/ /var/www/moodledata_src/cache/ /var/www/moodledata_src/localcache/ && cp -rf /var/www/moodledata_src /var/www/site/moodledata && cp -rf /var/www/moodle /var/www/site/moodle && chown -R 33:33 /var/www/site; fi"]
          volumeMounts:
          - name: moodle-pvc
            mountPath: /var/www/site
      restartPolicy: Always
      volumes:
        - name: moodle-pvc
          persistentVolumeClaim:
            claimName: moodle-pvc
