<VirtualHost *:80>
	ServerAdmin webmaster@localhost
	DocumentRoot /var/www/moodle

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

</VirtualHost>

# support 443 virtual host
<VirtualHost *:443>
	ServerAdmin webmaster@localhost
	DocumentRoot /var/www/moodle

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

	SSLEngine on
	ServerName prod-lmsbizflycloud.ga
	SSLCertificateFile /etc/letsencrypt/live/prod-lmsbizflycloud.ga/fullchain.pem
	SSLCertificateKeyFile /etc/letsencrypt/live/prod-lmsbizflycloud.ga/privkey.pem
	Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>

