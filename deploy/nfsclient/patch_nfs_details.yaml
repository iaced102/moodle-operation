apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nfs-client-provisioner
  name: nfs-client-provisioner
spec:
  template:
    spec:
      containers:
        - name: nfs-client-provisioner
          env:
            - name: NFS_SERVER
              value: 14.225.36.247
            - name: NFS_PATH
              value: /moodle
      volumes:
        - name: nfs-client-root
          nfs:
            server: 14.225.36.247
            path: /moodle
